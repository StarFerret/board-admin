# Builds and publishes a StarFerret release when a v* tag is pushed.
# Everything it uploads is what the installer downloads:
#   install-starferret.sh, starferret-macos.tar.gz, librechat-<version>-darwin-arm64.tar.gz, SHA256SUMS
# plus the Mac app:
#   StarFerret.dmg               when the Apple signing secrets below are set: opens with a double click
#   StarFerret-early-access.dmg  when they are not: not signed by Apple, so testers confirm it
#                                once in System Settings (installer/macos/early-access.md, also
#                                inside the .dmg and at the top of the release notes)
# Owner's call, 2026-11-14: ship the early access build until the app is signed.
#
# Secrets for the signed .dmg (Settings, Secrets and variables, Actions):
#   MACOS_CERT_P12_BASE64   Developer ID Application certificate, exported as .p12, base64
#   MACOS_CERT_PASSWORD     the .p12 password
#   MACOS_SIGN_ID           "Developer ID Application: <Company> (<TEAMID>)"
#   NOTARY_KEY_P8_BASE64    App Store Connect API key (.p8), base64
#   NOTARY_KEY_ID           its key ID
#   NOTARY_ISSUER_ID        its issuer ID
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Apple silicon, so LibreChat's native modules match customers' Macs.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.NOTARY_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Never run before the first release. If it fails, the release still ships
      # without it and installs build LibreChat from source, as before.
      - name: Build LibreChat
        continue-on-error: true
        run: bash installer/macos/build-librechat.sh

      - name: Build the StarFerret bundle and checksums
        run: bash installer/macos/build-release.sh "$GITHUB_REF_NAME"

      - name: Load the signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build the signed and notarized StarFerret.dmg
        if: env.HAS_SIGNING == 'true'
        env:
          STARFERRET_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8" bash installer/macos/build-dmg.sh

      - name: Build the early access StarFerret-early-access.dmg (not signed by Apple)
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::notice::No Apple signing secrets, so this release has the early access .dmg. Add the secrets listed at the top of release.yml for a signed one."
          bash installer/macos/build-dmg.sh

      - name: Check the checksums
        run: cd dist && shasum -a 256 -c SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="dist/install-starferret.sh dist/SHA256SUMS $(ls dist/*.tar.gz dist/*.dmg)"
          NOTES="$RUNNER_TEMP/notes.md"
          if [ -f dist/StarFerret-early-access.dmg ]; then
            { echo "**Mac app:** download \`StarFerret-early-access.dmg\`. It is not signed by Apple yet, so macOS asks you to confirm it once:"; echo; echo '```'; cat installer/macos/early-access.md; echo '```'; echo; } > "$NOTES"
          else
            echo "**Mac app:** download \`StarFerret.dmg\`, drag StarFerret to Applications, and open it." > "$NOTES"
          fi
          { echo; echo "**For IT, one Terminal line:** \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install-starferret.sh | bash\`"; } >> "$NOTES"
          gh release create "$GITHUB_REF_NAME" $FILES --title "StarFerret $GITHUB_REF_NAME" --notes-file "$NOTES" --generate-notes
