services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://${STARFERRET_HOST}:5678/
      # Plain http on the office network. Without this n8n refuses the sign in cookie.
      N8N_SECURE_COOKIE: "false"
    restart: unless-stopped

volumes:
  n8n-data:
